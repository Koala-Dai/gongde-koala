name: Build & Release

# 触发：推送 v* 标签（如 v0.1.0）或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发布需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.os }})
        run: npm run ${{ matrix.script }}
        env:
          CI: true

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # 创建 Release（已存在则忽略）
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes || true
          # 上传本次构建产物（dmg / zip / exe / blockmap）
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
