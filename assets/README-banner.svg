<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ee"/>
      <stop offset="1" stop-color="#f7f1e3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9bb7a4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <text x="600" y="56" text-anchor="middle" font-size="26" fill="#3c5a45" font-weight="600">陪你上班的桌面木鱼 · 治愈系考拉宠物</text>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="300" y="80" width="600" height="320" rx="22" fill="#ffffff" stroke="#e4ebe4" stroke-width="1.5"/>
  </g>
  <circle cx="332" cy="108" r="6" fill="#ff6058"/>
  <circle cx="356" cy="108" r="6" fill="#ffbd2e"/>
  <circle cx="380" cy="108" r="6" fill="#29c93f"/>
  <line x1="300" y1="132" x2="900" y2="132" stroke="#eef1ee" stroke-width="1.5"/>

  <!-- koala -->
  <g>
    <circle cx="400" cy="200" r="34" fill="#aebfcf"/>
    <circle cx="500" cy="200" r="34" fill="#aebfcf"/>
    <circle cx="400" cy="200" r="18" fill="#f0c9d2"/>
    <circle cx="500" cy="200" r="18" fill="#f0c9d2"/>
    <circle cx="450" cy="235" r="62" fill="#aebfcf"/>
    <ellipse cx="450" cy="258" rx="30" ry="38" fill="#51606e"/>
    <circle cx="428" cy="222" r="5" fill="#2b3540"/>
    <circle cx="472" cy="222" r="5" fill="#2b3540"/>
    <path d="M428 285 Q450 302 472 285" fill="none" stroke="#2b3540" stroke-width="3" stroke-linecap="round"/>
    <!-- 木鱼 -->
    <ellipse cx="450" cy="350" rx="46" ry="24" fill="#c5854f"/>
    <rect x="442" y="318" width="16" height="14" rx="4" fill="#a96c3b"/>
    <path d="M412 350 Q450 366 488 350" fill="none" stroke="#a96c3b" stroke-width="3"/>
  </g>

  <!-- bubbles -->
  <g>
    <rect x="600" y="160" width="250" height="62" rx="18" fill="#d6efe0"/>
    <path d="M600 196 l-16 -10 l0 22 z" fill="#d6efe0"/>
    <text x="690" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#2f6b45">功德 +1</text>

    <rect x="600" y="244" width="252" height="104" rx="18" fill="#fdf2d2"/>
    <text x="624" y="276" font-size="18" fill="#8a6a23">八月事业运</text>
    <text x="624" y="304" font-size="20" fill="#caa12a" letter-spacing="2">★★★☆</text>
    <text x="624" y="336" font-size="18" fill="#8a6a23">财运 ★★★★</text>
  </g>

  <!-- pills -->
  <g font-size="18" fill="#3c5a45" text-anchor="middle">
    <rect x="330" y="430" width="120" height="40" rx="20" fill="#eef5f0"/>
    <text x="390" y="456">八字</text>
    <rect x="470" y="430" width="120" height="40" rx="20" fill="#eef5f0"/>
    <text x="530" y="456">星座</text>
    <rect x="610" y="430" width="120" height="40" rx="20" fill="#eef5f0"/>
    <text x="670" y="456">抽签</text>
    <rect x="750" y="430" width="140" height="40" rx="20" fill="#eef5f0"/>
    <text x="820" y="456">幸运数字</text>
  </g>
</svg>
